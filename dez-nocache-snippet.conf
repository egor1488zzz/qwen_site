# DezComfort: запрет кэширования HTML/JS/CSS на уровне nginx.
# Подключается строкой  include /etc/nginx/snippets/dez-nocache.conf;
# внутри каждого server-блока сайта (добавляет location'ы).

location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
    try_files $uri =404;
}

location ^~ /js/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires -1;
}

location ^~ /css/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires -1;
}
